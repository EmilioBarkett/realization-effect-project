[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realization-effect-project"
version = "0.1.0"
description = "Activation-analysis primitives for decodability and steerability experiments."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "openai",
  "pandas",
  "scipy",
  "statsmodels",
]

[project.scripts]
activation-export-emotion-probes = "activation_analysis.emotion_probes:main"
activation-log-residuals = "activation_analysis.log_residuals:main"

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest",
  "ruff",
  "seaborn",
]
interp = [
  "torch",
  "transformers",
]
report = [
  "matplotlib",
  "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "external",
  "models",
  "notebooks",
  "reports",
  "results",
  "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
